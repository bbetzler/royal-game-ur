<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- App icon: a green rosette square, like the board's rosettes. -->
  <rect width="512" height="512" fill="#4caf50"/>
  <g fill="#fff" transform="translate(256 256)">
    <g id="petal-pair">
      <ellipse rx="34" ry="96" cy="-92"/>
      <ellipse rx="34" ry="96" cy="92"/>
    </g>
    <use href="#petal-pair" transform="rotate(45)"/>
    <use href="#petal-pair" transform="rotate(90)"/>
    <use href="#petal-pair" transform="rotate(135)"/>
  </g>
  <circle cx="256" cy="256" r="40" fill="#4caf50"/>
  <circle cx="256" cy="256" r="24" fill="#fff"/>
</svg>
